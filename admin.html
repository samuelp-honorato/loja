<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Gestão - Loja</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0f1115; color: #e5e7eb; margin: 0; display: flex; height: 100vh; }
        .sidebar-admin { width: 450px; background: #161b22; padding: 30px; overflow-y: auto; border-right: 1px solid #30363d; }
        .preview-area { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0d1117; padding: 20px; }
        h2 { margin-top: 0; font-size: 20px; color: #fff; border-bottom: 1px solid #30363d; padding-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; margin-bottom: 5px; color: #8b949e; }
        input, textarea { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 6px; box-sizing: border-box; }
        .file-upload { border: 2px dashed #30363d; padding: 20px; text-align: center; border-radius: 6px; cursor: pointer; background: #0d1117; display: block;}
        input[type="file"] { display: none; }
        .btn-salvar { background: #238636; color: #fff; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .card { background: #161b22; border-radius: 8px; width: 300px; border: 1px solid #30363d; overflow: hidden; }
        .card img { width: 100%; height: 350px; object-fit: cover; background: #222; }
        .card-info { padding: 20px; }
        .tag { background: #21262d; padding: 4px 8px; border-radius: 4px; font-size: 11px; border: 1px solid #30363d; }
        .card h4 { margin: 10px 0 5px 0; color: #fff; }
        .card p { margin: 0 0 15px 0; color: #8b949e; font-size: 13px; }
        .card-price { font-size: 20px; font-weight: bold; color: #fff; }
        
        .item-estoque { background: #0d1117; border: 1px solid #30363d; padding: 12px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .item-estoque img { width: 45px; height: 45px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="sidebar-admin">
        <h2>Adicionar Nova Peça</h2>
        
        <div class="form-group">
            <label class="file-upload">
                <span id="file-label">Clique para escolher a foto...</span>
                <input type="file" id="imagemFile" accept=".png, .jpg, .jpeg" onchange="processarImagem(event)">
            </label>
        </div>

        <div class="form-group">
            <label>Nome da Peça</label>
            <input type="text" id="nome" placeholder="Ex: Jaqueta Puffer" oninput="atualizarPreview()">
        </div>

        <div class="form-group" style="display: flex; gap: 10px;">
            <div style="flex: 1;"><label>Preço (R$)</label><input type="number" id="preco" placeholder="149.90" oninput="atualizarPreview()"></div>
            <div style="flex: 1;"><label>Qtd Estoque</label><input type="number" id="estoque" placeholder="10"></div>
        </div>

        <div class="form-group" style="display: flex; gap: 10px;">
            <div style="flex: 1;"><label>Tamanho</label><input type="text" id="tamanho" placeholder="M" oninput="atualizarPreview()"></div>
            <div style="flex: 1;"><label>Cor</label><input type="text" id="cor" placeholder="Preto" oninput="atualizarPreview()"></div>
        </div>

        <div class="form-group">
            <label>Descrição Breve</label>
            <textarea id="descricao" rows="2" oninput="atualizarPreview()"></textarea>
        </div>

        <button class="btn-salvar" onclick="cadastrarProduto()">Publicar no Catálogo</button>

        <h2 style="margin-top: 40px; border-top: 1px solid #30363d; padding-top: 20px;">Meu Estoque</h2>
        <div id="lista-estoque"><p style="color:#8b949e; font-size: 13px;">Carregando...</p></div>
    </div>

    <div class="preview-area">
        <div style="color: #8b949e; margin-bottom: 20px;">Pré-visualização</div>
        <div class="card">
            <img id="prev-img" src="" alt="Sem imagem">
            <div class="card-info">
                <span class="tag" id="prev-tam">Tam: --</span> <span class="tag" id="prev-cor">Cor: --</span>
                <h4 id="prev-nome">Nome da Peça</h4>
                <p id="prev-desc">A descrição aparecerá aqui.</p>
                <div class="card-price" id="prev-preco">R$ 0,00</div>
            </div>
        </div>
    </div>

    <script>
        let imagemBase64 = "";

        function processarImagem(event) {
            const file = event.target.files[0];
            if (!file) return;
            document.getElementById('file-label').innerText = file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                imagemBase64 = e.target.result;
                document.getElementById('prev-img').src = imagemBase64;
            };
            reader.readAsDataURL(file);
        }

        function atualizarPreview() {
            document.getElementById('prev-nome').innerText = document.getElementById('nome').value || 'Nome da Peça';
            document.getElementById('prev-desc').innerText = document.getElementById('descricao').value || 'A descrição aparecerá aqui.';
            document.getElementById('prev-tam').innerText = 'Tam: ' + (document.getElementById('tamanho').value || '--');
            document.getElementById('prev-cor').innerText = 'Cor: ' + (document.getElementById('cor').value || '--');
            const preco = parseFloat(document.getElementById('preco').value) || 0;
            document.getElementById('prev-preco').innerText = `R$ ${preco.toFixed(2).replace('.', ',')}`;
        }

        async function cadastrarProduto() {
            if(!imagemBase64 || !document.getElementById('nome').value) return alert("Preencha o nome e adicione uma imagem!");

            const dados = {
                nome: document.getElementById('nome').value, preco: parseFloat(document.getElementById('preco').value),
                estoque: parseInt(document.getElementById('estoque').value), imagem_url: imagemBase64,
                descricao: document.getElementById('descricao').value, tamanho: document.getElementById('tamanho').value,
                cor: document.getElementById('cor').value
            };

            document.querySelector('.btn-salvar').innerText = "Salvando...";
            
            await fetch('/api/produtos', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dados)
            });
            
            alert('Produto publicado!');
            window.location.reload();
        }

        async function carregarEstoque() {
            const resposta = await fetch('/api/admin/produtos');
            const produtos = await resposta.json();
            const lista = document.getElementById('lista-estoque');
            
            if (produtos.length === 0) {
                lista.innerHTML = '<p style="color:#8b949e; font-size: 14px;">Você ainda não cadastrou produtos oficiais.</p>';
                return;
            }

            lista.innerHTML = '';
            produtos.forEach(p => {
                const corEstoque = p.estoque > 0 ? '#2ea043' : '#f85149';
                lista.innerHTML += `
                    <div class="item-estoque">
                        <div style="display: flex; gap: 12px; align-items: center;">
                            <img src="${p.imagem_url}">
                            <div>
                                <div style="font-weight: bold; font-size: 14px; color: #fff;">${p.nome}</div>
                                <div style="font-size: 12px; color: #8b949e;">R$ ${p.preco.toFixed(2)} | Tam: ${p.tamanho} | Cor: ${p.cor}</div>
                            </div>
                        </div>
                        <div style="font-size: 13px; font-weight: bold; color: ${corEstoque};">Estoque: ${p.estoque}</div>
                    </div>
                `;
            });
        }
        carregarEstoque();
    </script>
</body>
</html>
