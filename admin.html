<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel PRO - Gestão de Estoque</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #06080a; color: #e5e7eb; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 260px; background: #111827; border-right: 1px solid #1f2937; display: flex; flex-direction: column; }
        .logo { padding: 30px 20px; font-size: 20px; font-weight: bold; border-bottom: 1px solid #1f2937; letter-spacing: 1px; color: #fff; }
        .nav-menu { padding: 20px 0; flex-grow: 1; }
        .nav-item { padding: 15px 25px; cursor: pointer; color: #9ca3af; transition: 0.2s; border-left: 3px solid transparent; }
        .nav-item:hover, .nav-item.active { background: #1f2937; color: #fff; border-left-color: #3b82f6; }
        .logout { padding: 20px; border-top: 1px solid #1f2937; text-align: center; }
        .logout a { color: #ef4444; text-decoration: none; font-weight: bold; font-size: 14px; }
        
        .main-content { flex-grow: 1; background: #06080a; overflow-y: auto; padding: 40px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { margin: 0; font-size: 24px; font-weight: 500; }
        
        .card-panel { background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 30px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #9ca3af; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select, textarea { width: 100%; padding: 12px; background: #1f2937; border: 1px solid #374151; color: #fff; border-radius: 6px; box-sizing: border-box; }
        input:focus, select:focus { border-color: #3b82f6; outline: none; }
        .file-upload { border: 2px dashed #374151; padding: 30px; text-align: center; border-radius: 6px; cursor: pointer; background: #111827; margin-bottom: 20px; color: #9ca3af; }
        input[type="file"] { display: none; }
        .btn-salvar { background: #3b82f6; color: #fff; border: none; padding: 14px 24px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 20px; float: right; transition: 0.2s; }
        .btn-salvar:hover { background: #2563eb; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 15px; border-bottom: 1px solid #374151; color: #9ca3af; font-size: 13px; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #1f2937; vertical-align: middle; }
        .img-thumb { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; border: 1px solid #374151; background: #1f2937; color: #d1d5db; }
        
        .aba { display: none; }
        .aba.ativa { display: block; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">MARLI PRO</div>
        <div class="nav-menu">
            <div class="nav-item active" onclick="mudarAba('aba-cadastrar', this)">+ Cadastrar Produto</div>
            <div class="nav-item" onclick="mudarAba('aba-estoque', this)">📦 Controle de Estoque</div>
        </div>
        <div class="logout"><a href="/api/logout">Sair do Sistema</a></div>
    </div>

    <div class="main-content">
        
        <div id="aba-cadastrar" class="aba ativa">
            <div class="header"><h1>Adicionar ao Catálogo</h1></div>
            
            <div class="card-panel">
                <label class="file-upload">
                    <span id="file-label">📸 Clique para fazer upload da foto (PNG, JPG)</span>
                    <input type="file" id="imagemFile" accept=".png, .jpg, .jpeg" onchange="processarImagem(event)">
                </label>

                <div class="grid-form">
                    <div class="form-group">
                        <label>Nome do Produto</label>
                        <input type="text" id="nome" placeholder="Ex: Conjunto Renda Luxo">
                    </div>
                    <div class="form-group">
                        <label>Categoria</label>
                        <select id="categoria">
                            <option value="Calcinha">Calcinha</option>
                            <option value="Sutiã">Sutiã</option>
                            <option value="Cueca">Cueca</option>
                            <option value="Baby Doll">Baby Doll</option>
                            <option value="Conjunto">Conjunto</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Preço de Venda (R$)</label><input type="number" id="preco" placeholder="89.90"></div>
                    <div class="form-group"><label>Quantidade em Estoque</label><input type="number" id="estoque" placeholder="10"></div>
                    
                    <div class="form-group"><label>Tamanho (M, G, GG)</label><input type="text" id="tamanho" placeholder="M"></div>
                    <div class="form-group">
                        <label>Modelo da Etiqueta (Cor)</label>
                        <select id="etiqueta">
                            <option value="Cinza">Cinza</option>
                            <option value="Roxa">Roxa</option>
                            <option value="Prata">Prata</option>
                            <option value="Dourada">Dourada</option>
                            <option value="Preta">Preta</option>
                            <option value="Padrão">Padrão</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label>Descrição do Material / Caimento</label>
                    <textarea id="descricao" rows="3" placeholder="Detalhes para convencer o cliente..."></textarea>
                </div>

                <button class="btn-salvar" onclick="cadastrarProduto()">Publicar Produto</button>
                <div style="clear: both;"></div>
            </div>
        </div>

        <!-- ABA: ESTOQUE -->
        <div id="aba-estoque" class="aba">
            <div class="header"><h1>Gestão de Estoque</h1></div>
            <div class="card-panel" style="padding: 0;">
                <table>
                    <thead>
                        <tr>
                            <th>Foto</th>
                            <th>Produto</th>
                            <th>Categoria / Etiqueta</th>
                            <th>Valor</th>
                            <th>Status (Estoque)</th>
                        </tr>
                    </thead>
                    <tbody id="lista-estoque">
                        <tr><td colspan="5" style="text-align: center; color: #9ca3af;">Carregando produtos...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        function mudarAba(idAba, elemento) {
            document.querySelectorAll('.aba').forEach(a => a.classList.remove('ativa'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(idAba).classList.add('ativa');
            elemento.classList.add('active');
            if(idAba === 'aba-estoque') carregarEstoque();
        }

        let imagemBase64 = "";
        function processarImagem(event) {
            const file = event.target.files[0];
            if (!file) return;
            document.getElementById('file-label').innerText = "✅ " + file.name + " carregada com sucesso!";
            const reader = new FileReader();
            reader.onload = e => imagemBase64 = e.target.result;
            reader.readAsDataURL(file);
        }

        // Cadastrar
        async function cadastrarProduto() {
            if(!imagemBase64 || !document.getElementById('nome').value) return alert("Preencha o nome e adicione a imagem!");
            const btn = document.querySelector('.btn-salvar');
            btn.innerText = "Salvando...";

            const dados = {
                nome: document.getElementById('nome').value, preco: parseFloat(document.getElementById('preco').value),
                estoque: parseInt(document.getElementById('estoque').value), imagem_url: imagemBase64,
                descricao: document.getElementById('descricao').value, tamanho: document.getElementById('tamanho').value,
                cor: document.getElementById('etiqueta').value, 
                categoria: document.getElementById('categoria').value,
                etiqueta: document.getElementById('etiqueta').value
            };

            const resp = await fetch('/api/produtos', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dados)
            });

            if (resp.status === 401) { alert("Sessão expirada. Faça login novamente."); window.location.href = '/login'; return; }
            alert('Sucesso! Produto publicado na loja.');
            window.location.reload();
        }

        // Listar Estoque
        async function carregarEstoque() {
            const resposta = await fetch('/api/admin/produtos');
            if (resposta.status === 401) { window.location.href = '/login'; return; }
            
            const produtos = await resposta.json();
            const lista = document.getElementById('lista-estoque');
            
            if (produtos.length === 0) {
                lista.innerHTML = '<tr><td colspan="5" style="text-align: center;">Nenhum produto cadastrado ainda.</td></tr>';
                return;
            }

            lista.innerHTML = '';
            produtos.forEach(p => {
                const corStatus = p.estoque > 0 ? '#10b981' : '#ef4444';
                const msgStatus = p.estoque > 0 ? `${p.estoque} unidades` : 'ESGOTADO';
                
                lista.innerHTML += `
                    <tr>
                        <td><img src="${p.imagem_url}" class="img-thumb"></td>
                        <td><strong>${p.nome}</strong><br><span style="font-size: 11px; color:#9ca3af;">Tam: ${p.tamanho}</span></td>
                        <td>
                            <span class="badge">${p.categoria}</span> 
                            <span class="badge" style="background: #374151;">Etiqueta ${p.etiqueta}</span>
                        </td>
                        <td>R$ ${p.preco.toFixed(2)}</td>
                        <td style="color: ${corStatus}; font-weight: bold;">${msgStatus}</td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
