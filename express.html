<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e1b20">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Marli Essencial | Express</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231e1b20'/><text x='50%' y='50%' font-family='Inter, sans-serif' font-size='60' font-weight='800' fill='%23b48484' dominant-baseline='central' text-anchor='middle'>M</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        :root {
            --dark: #1e1b20;
            --bg: #f6f4f4;
            --card: #ffffff;
            --text: #1e1b20;
            --muted: #64748b;
            --primary: #b48484;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #e5e0e0;
        }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            padding-bottom: 82px;
        }

        .top-bar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--dark);
            color: #fff;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand-wrap { display: flex; align-items: center; gap: 8px; }
        .brand-badge {
            background: var(--primary);
            color: #fff;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 12px;
            text-transform: uppercase;
        }
        .brand-title { font-size: 16px; font-weight: 800; }
        .top-actions { display: flex; align-items: center; gap: 6px; }
        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
        }
        .spin { animation: spin 0.7s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .kpi-strip {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 12px 14px 4px;
            max-width: 640px;
            margin: 0 auto;
        }
        .kpi-mini {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
        }
        .kpi-mini span {
            display: block;
            font-size: 10px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .kpi-mini strong { font-size: 18px; font-weight: 800; }

        .container { padding: 10px 14px; max-width: 640px; margin: 0 auto; }

        .filter-row {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            align-items: center;
            justify-content: space-between;
        }
        .chips-group { display: flex; gap: 6px; overflow-x: auto; }
        .chip {
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--muted);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .chip.active { background: var(--dark); color: #fff; border-color: var(--dark); }

        .mode-switch {
            display: flex;
            background: #eae6e6;
            padding: 2px;
            border-radius: 8px;
            flex-shrink: 0;
        }
        .mode-btn {
            border: none;
            background: transparent;
            width: 32px;
            height: 28px;
            border-radius: 6px;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .mode-btn.active { background: #fff; color: var(--dark); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }

        .card-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .section-heading {
            font-size: 15px;
            font-weight: 800;
            margin: 0 0 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Pedidos Compactos */
        .order-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
        }
        .order-card.pendente { border-left: 3px solid var(--warning); }
        .order-card.pago { border-left: 3px solid var(--success); }
        .order-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .order-id { font-weight: 800; font-size: 13px; }
        .order-date { font-size: 11px; color: var(--muted); margin-left: 4px; }
        .pill { padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .pill.pendente { background: #fef3c7; color: #b45309; }
        .pill.pago { background: #d1fae5; color: #047857; }
        .pill.cancelado { background: #fee2e2; color: #991b1b; }

        .client-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .client-name { font-size: 15px; font-weight: 700; }
        .btn-wa-mini {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #ecfdf5;
            color: #059669;
            border: 1px solid #a7f3d0;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-decoration: none;
        }
        .order-items {
            background: #faf8f8;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            color: #334155;
            line-height: 1.45;
            margin-bottom: 10px;
        }
        .order-footer { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .order-total-label { font-size: 11px; color: var(--muted); font-weight: 600; }
        .order-total-val { font-size: 17px; font-weight: 800; }

        .action-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
        .btn-touch {
            height: 40px;
            border-radius: 10px;
            border: none;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
            width: 100%;
            text-decoration: none;
        }
        .btn-confirm { background: var(--success); color: #fff; }
        .btn-wa-receipt { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
        .btn-primary-mobile { background: var(--primary); color: #fff; }
        .btn-cancel { background: #fff; color: var(--danger); border: 1px solid #fecaca; }

        /* Busca e Estoque */
        .search-box { position: relative; margin-bottom: 10px; }
        .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 16px; }
        .search-box input {
            width: 100%;
            height: 40px;
            padding: 0 12px 0 36px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--card);
            font-size: 13px;
        }

        /* Modo Lista Compacta */
        .stock-row {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .stock-row.hidden-item { opacity: 0.6; }
        .stock-img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: contain;
            background: #faf8f8;
            border: 1px solid var(--border);
            flex-shrink: 0;
            padding: 2px;
        }
        .stock-info { flex-grow: 1; min-width: 0; }
        .stock-name {
            font-size: 13px;
            font-weight: 700;
            margin: 0 0 2px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .stock-meta { font-size: 11px; color: var(--muted); }
        .stock-price { font-size: 13px; font-weight: 800; color: var(--dark); margin-top: 2px; }

        .stock-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
        .stepper {
            display: flex;
            align-items: center;
            background: #f4f1f1;
            border-radius: 8px;
            padding: 2px;
            border: 1px solid var(--border);
        }
        .step-btn {
            width: 28px;
            height: 28px;
            border: none;
            background: #fff;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 800;
            color: var(--dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .step-val { min-width: 28px; text-align: center; font-size: 13px; font-weight: 800; }
        .step-val.low { color: var(--danger); }

        .row-mini-icons { display: flex; gap: 4px; }
        .ico-mini {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #faf8f8;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Modo Grade 2 Colunas */
        .stock-grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .stock-grid-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .stock-grid-card.hidden-item { opacity: 0.6; }
        .stock-grid-img {
            width: 100%;
            height: 120px;
            object-fit: contain;
            background: #faf8f8;
            border-bottom: 1px solid var(--border);
            padding: 6px;
        }
        .stock-grid-body { padding: 8px 10px; display: flex; flex-direction: column; flex-grow: 1; }
        .stock-grid-title {
            font-size: 12px;
            font-weight: 700;
            margin: 0 0 3px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .stock-grid-sub { font-size: 10px; color: var(--muted); margin-bottom: 8px; }
        .stock-grid-foot {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4px;
        }
        .stock-grid-tools {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px solid #f1ecec;
        }
        .stock-grid-tools button {
            height: 26px;
            border: 1px solid var(--border);
            background: #faf8f8;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Formulário */
        .field-group { margin-bottom: 12px; }
        .field-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        label.lbl { display: block; font-size: 11px; font-weight: 700; color: #475569; margin-bottom: 4px; text-transform: uppercase; }
        input.inp, select.inp, textarea.inp {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            background: #fdfbfb;
        }
        textarea.inp { height: auto; padding: 10px 12px; }
        .upload-box-mobile {
            border: 2px dashed #cbbdbd;
            background: #fdfbfb;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 14px;
            display: block;
        }
        .preview-thumb-mob { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; margin: 0 auto 6px; display: none; }

        .cat-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid #f1ecec; }
        .cat-row:last-child { border-bottom: none; }
        .cat-name { font-size: 14px; font-weight: 700; }

        /* Barra Inferior */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #fff;
            border-top: 1px solid var(--border);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            height: 64px;
            z-index: 60;
        }
        .nav-tab {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            cursor: pointer;
            position: relative;
        }
        .nav-tab.active { color: var(--dark); }
        .nav-indicator {
            position: absolute;
            top: 0;
            width: 28px;
            height: 3px;
            background: var(--primary);
            border-radius: 0 0 3px 3px;
            display: none;
        }
        .nav-tab.active .nav-indicator { display: block; }
        .nav-badge {
            position: absolute;
            top: 6px;
            margin-left: 22px;
            background: var(--danger);
            color: #fff;
            font-size: 9px;
            font-weight: 800;
            padding: 1px 5px;
            border-radius: 10px;
        }

        .tab-view { display: none; }
        .tab-view.active { display: block; }
        .empty-state {
            text-align: center;
            padding: 32px 16px;
            color: var(--muted);
            background: #fff;
            border-radius: 12px;
            border: 1px dashed var(--border);
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="brand-wrap">
            <span class="brand-title">Marli Essencial</span>
            <span class="brand-badge">Express</span>
        </div>
        <div class="top-actions">
            <button class="icon-btn" id="btn-refresh" onclick="atualizarTudo()" title="Atualizar">
                <i data-lucide="refresh-cw" style="width: 16px;"></i>
            </button>
            <a href="/painel" class="icon-btn" title="Painel Completo">
                <i data-lucide="layout-dashboard" style="width: 16px;"></i>
            </a>
            <a href="/api/logout" class="icon-btn" title="Sair">
                <i data-lucide="log-out" style="width: 16px; color: #fca5a5;"></i>
            </a>
        </div>
    </header>

    <div class="kpi-strip">
        <div class="kpi-mini">
            <span>Vendas Hoje</span>
            <strong id="kpi-hoje" style="color: var(--success);">R$ 0,00</strong>
        </div>
        <div class="kpi-mini">
            <span>Pendentes</span>
            <strong id="kpi-pendentes" style="color: var(--warning);">0</strong>
        </div>
    </div>

    <div class="container">
        <!-- ABA 1: PEDIDOS -->
        <section id="view-pedidos" class="tab-view active">
            <div class="filter-row">
                <div class="chips-group">
                    <button class="chip active" id="chip-ped-pendentes" onclick="setFiltroPedido('Pendente')">Pendentes</button>
                    <button class="chip" id="chip-ped-todos" onclick="setFiltroPedido('Todos')">Todos</button>
                </div>
            </div>
            <div id="lista-pedidos-mobile"></div>
        </section>

        <!-- ABA 2: ESTOQUE -->
        <section id="view-estoque" class="tab-view">
            <div class="search-box">
                <i data-lucide="search"></i>
                <input type="text" id="busca-mobile" placeholder="Buscar peça, categoria ou SKU..." oninput="renderizarEstoqueMobile()">
            </div>
            <div class="filter-row">
                <div class="chips-group">
                    <button class="chip active" id="chip-est-todos" onclick="setFiltroEstoque('todos')">Todos</button>
                    <button class="chip" id="chip-est-baixo" onclick="setFiltroEstoque('baixo')">Baixo (&lt; 3)</button>
                </div>
                <div class="mode-switch">
                    <button class="mode-btn active" id="btn-mob-lista" onclick="setModoEstoqueMobile('lista')" title="Lista">
                        <i data-lucide="list" style="width:15px;"></i>
                    </button>
                    <button class="mode-btn" id="btn-mob-grid" onclick="setModoEstoqueMobile('grid')" title="Grade 2 Colunas">
                        <i data-lucide="layout-grid" style="width:15px;"></i>
                    </button>
                </div>
            </div>
            <div id="lista-estoque-mobile"></div>
        </section>

        <!-- ABA 3: NOVO / EDITAR PRODUTO -->
        <section id="view-produto" class="tab-view">
            <div class="card-box">
                <div class="section-heading">
                    <span id="form-prod-titulo">Cadastrar Nova Peça</span>
                    <button id="btn-cancelar-edicao" onclick="resetarFormProduto()" style="display:none; background:none; border:none; color:var(--danger); font-size:12px; font-weight:700; cursor:pointer;">Cancelar</button>
                </div>

                <label class="upload-box-mobile" id="label-foto-mob">
                    <img id="preview-foto-mob" class="preview-thumb-mob" alt="Preview">
                    <i data-lucide="camera" id="icone-cam-mob" style="width: 28px; height: 28px; color: var(--primary); margin-bottom: 4px;"></i>
                    <div id="texto-foto-mob" style="font-size: 13px; font-weight: 700;">Tirar Foto ou Abrir Galeria</div>
                    <div style="font-size: 11px; color: var(--muted);">Até 3 imagens (JPG, PNG ou WEBP)</div>
                    <input type="file" id="input-foto-mob" style="display:none;" accept="image/jpeg,image/png,image/webp" multiple onchange="aoSelecionarFotos(event)">
                </label>

                <div class="field-group">
                    <label class="lbl">Nome da Peça</label>
                    <input type="text" id="mob-nome" class="inp" placeholder="Ex: Conjunto Renda Rosé">
                </div>

                <div class="field-group">
                    <label class="lbl">Categoria</label>
                    <select id="mob-categoria" class="inp"></select>
                </div>

                <div class="field-row-2 field-group">
                    <div>
                        <label class="lbl">Preço (R$)</label>
                        <input type="number" step="0.01" min="0.01" id="mob-preco" class="inp" placeholder="59.90">
                    </div>
                    <div>
                        <label class="lbl">Estoque</label>
                        <input type="number" min="0" id="mob-estoque" class="inp" value="5">
                    </div>
                </div>

                <div class="field-row-2 field-group">
                    <div>
                        <label class="lbl">Tamanho</label>
                        <input type="text" id="mob-tamanho" class="inp" placeholder="P, M, G ou Único">
                    </div>
                    <div>
                        <label class="lbl">Referência / SKU</label>
                        <input type="text" id="mob-etiqueta" class="inp" placeholder="Ex: REF-102">
                    </div>
                </div>

                <div class="field-group">
                    <label class="lbl">Descrição</label>
                    <textarea id="mob-descricao" class="inp" rows="2" placeholder="Detalhes do tecido ou fragrância..."></textarea>
                </div>

                <button class="btn-touch btn-primary-mobile" id="btn-salvar-mob" onclick="salvarProdutoMobile()">
                    <i data-lucide="check-circle" style="width: 16px;"></i> Publicar no Catálogo
                </button>
            </div>
        </section>

        <!-- ABA 4: CATEGORIAS -->
        <section id="view-categorias" class="tab-view">
            <div class="card-box">
                <h3 class="section-heading">Nova Categoria</h3>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="mob-nova-cat" class="inp" placeholder="Ex: Perfumes, Conjuntos...">
                    <button class="btn-touch btn-primary-mobile" style="width: auto; padding: 0 18px; height: 42px;" onclick="criarCategoriaMobile()">Criar</button>
                </div>
            </div>

            <div class="card-box" style="padding: 4px 12px;">
                <div id="lista-categorias-mobile"></div>
            </div>
        </section>
    </div>

    <nav class="bottom-nav">
        <button class="nav-tab active" id="tab-btn-pedidos" onclick="trocarAba('pedidos')">
            <span class="nav-indicator"></span>
            <i data-lucide="shopping-bag" style="width: 19px;"></i>
            <span>Pedidos</span>
            <span class="nav-badge" id="badge-nav-pendentes" style="display: none;">0</span>
        </button>
        <button class="nav-tab" id="tab-btn-estoque" onclick="trocarAba('estoque')">
            <span class="nav-indicator"></span>
            <i data-lucide="package" style="width: 19px;"></i>
            <span>Estoque</span>
        </button>
        <button class="nav-tab" id="tab-btn-produto" onclick="abrirAbaNovoProduto()">
            <span class="nav-indicator"></span>
            <i data-lucide="plus-circle" style="width: 19px;"></i>
            <span>+ Produto</span>
        </button>
        <button class="nav-tab" id="tab-btn-categorias" onclick="trocarAba('categorias')">
            <span class="nav-indicator"></span>
            <i data-lucide="tags" style="width: 19px;"></i>
            <span>Categorias</span>
        </button>
    </nav>

    <script>
        lucide.createIcons();

        let pedidosCache = [];
        let produtosCache = [];
        let categoriasCache = [];
        let filtroPedidoAtual = 'Pendente';
        let filtroEstoqueAtual = 'todos';
        let modoEstoqueAtual = 'lista';

        let editandoId = null;
        let fotoUrl1 = "";
        let fotoUrl2 = "";
        let fotoUrl3 = "";

        function escapeHTML(str) {
            if (str === null || str === undefined) return "";
            const txt = document.createElement("textarea");
            txt.innerHTML = String(str);
            return txt.value
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function safeURL(url) {
            if (!url) return "https://via.placeholder.com/150?text=Foto";
            const u = String(url).trim();
            if (u.startsWith("https://") || u.startsWith("http://") || u.startsWith("data:image/")) {
                return escapeHTML(u);
            }
            return "https://via.placeholder.com/150?text=Foto";
        }

        async function fetchAdmin(url, options = {}) {
            const res = await fetch(url, options);
            if (res.status === 401) {
                window.location.href = "/login";
                throw new Error("Sessão expirada");
            }
            return res;
        }

        function trocarAba(aba) {
            document.querySelectorAll('.tab-view').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${aba}`).classList.add('active');
            document.getElementById(`tab-btn-${aba}`).classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function setFiltroPedido(filtro) {
            filtroPedidoAtual = filtro;
            document.getElementById('chip-ped-pendentes').classList.toggle('active', filtro === 'Pendente');
            document.getElementById('chip-ped-todos').classList.toggle('active', filtro === 'Todos');
            renderizarPedidosMobile();
        }

        function setFiltroEstoque(filtro) {
            filtroEstoqueAtual = filtro;
            document.getElementById('chip-est-todos').classList.toggle('active', filtro === 'todos');
            document.getElementById('chip-est-baixo').classList.toggle('active', filtro === 'baixo');
            renderizarEstoqueMobile();
        }

        function setModoEstoqueMobile(modo) {
            modoEstoqueAtual = modo;
            document.getElementById('btn-mob-lista').classList.toggle('active', modo === 'lista');
            document.getElementById('btn-mob-grid').classList.toggle('active', modo === 'grid');
            renderizarEstoqueMobile();
        }

        async function carregarIndicadores() {
            const res = await fetchAdmin('/api/admin/indicadores');
            const data = await res.json();
            document.getElementById('kpi-hoje').textContent = `R$ ${Number(data.faturamento_hoje).toFixed(2).replace('.', ',')}`;
            document.getElementById('kpi-pendentes').textContent = Number(data.pedidos_pendentes);

            const badge = document.getElementById('badge-nav-pendentes');
            if (data.pedidos_pendentes > 0) {
                badge.textContent = Number(data.pedidos_pendentes);
                badge.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
            }
        }

        async function carregarPedidos() {
            const res = await fetchAdmin('/api/admin/pedidos');
            pedidosCache = await res.json();
            renderizarPedidosMobile();
        }

        function renderizarPedidosMobile() {
            const container = document.getElementById('lista-pedidos-mobile');
            const filtrados = filtroPedidoAtual === 'Pendente'
                ? pedidosCache.filter(p => p.status === 'Pendente')
                : pedidosCache;

            if (filtrados.length === 0) {
                container.innerHTML = `<div class="empty-state">Nenhum pedido ${filtroPedidoAtual === 'Pendente' ? 'pendente no momento' : 'encontrado'}.</div>`;
                return;
            }

            let html = '';
            filtrados.forEach(p => {
                const pid = Number(p.id);
                const statusLower = String(p.status || 'Pendente').toLowerCase();
                const dataFormatada = new Date(p.data_criacao).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
                const resumoSafe = escapeHTML(p.resumo_pedido).replace(/\n/g, '<br>');
                const telDigitos = String(p.telefone || '').replace(/\D/g, '');
                const waNumero = telDigitos.startsWith('55') ? telDigitos : '55' + telDigitos;

                const waLink = telDigitos.length >= 8
                    ? `<a href="https://wa.me/${waNumero}" target="_blank" rel="noopener noreferrer" class="btn-wa-mini"><i data-lucide="message-circle" style="width:13px;"></i> WhatsApp</a>`
                    : '';

                const msgConfirmacao = encodeURIComponent(
                    `Olá, ${p.cliente_nome}! ✨ Passando para confirmar que o pagamento do seu Pedido #${pid} (R$ ${Number(p.total).toFixed(2).replace('.', ',')}) na Marli Essencial foi aprovado! Já estamos separando suas peças com todo carinho.`
                );

                let botoesAcao = '';
                if (p.status === 'Pendente') {
                    botoesAcao = `<div class="action-grid">
                        <button class="btn-touch btn-confirm" onclick="atualizarPedido(${pid}, 'Pago', this)">
                            <i data-lucide="check" style="width:16px;"></i> Confirmar Pago
                        </button>
                        <button class="btn-touch btn-cancel" onclick="atualizarPedido(${pid}, 'Cancelado', this)">
                            Cancelar
                        </button>
                       </div>`;
                } else if (p.status === 'Pago' && telDigitos.length >= 8) {
                    botoesAcao = `<a href="https://wa.me/${waNumero}?text=${msgConfirmacao}" target="_blank" rel="noopener noreferrer" class="btn-touch btn-wa-receipt">
                        <i data-lucide="send" style="width:15px;"></i> Avisar Pago no WhatsApp
                    </a>`;
                }

                html += `
                    <div class="order-card ${escapeHTML(statusLower)}">
                        <div class="order-head">
                            <div>
                                <span class="order-id">#${pid}</span>
                                <span class="order-date">${dataFormatada}</span>
                            </div>
                            <span class="pill ${escapeHTML(statusLower)}">${escapeHTML(p.status)}</span>
                        </div>
                        <div class="client-row">
                            <span class="client-name">${escapeHTML(p.cliente_nome)}</span>
                            ${waLink}
                        </div>
                        <div class="order-items">${resumoSafe}</div>
                        <div class="order-footer">
                            <span class="order-total-label">Total</span>
                            <span class="order-total-val">R$ ${Number(p.total).toFixed(2).replace('.', ',')}</span>
                        </div>
                        ${botoesAcao}
                    </div>
                `;
            });

            container.innerHTML = html;
            lucide.createIcons();
        }

        async function atualizarPedido(id, novoStatus, btn) {
            if (novoStatus === 'Cancelado' && !confirm(`Cancelar o pedido #${id}?`)) return;
            btn.disabled = true;
            try {
                const fd = new FormData();
                fd.append('status_novo', novoStatus);
                const res = await fetchAdmin(`/api/admin/pedidos/${Number(id)}/status`, {
                    method: 'PATCH',
                    body: fd
                });
                if (res.ok) {
                    if (novoStatus === 'Pago') setFiltroPedido('Todos');
                    await atualizarTudo();
                } else {
                    alert("Não foi possível atualizar o pedido.");
                    btn.disabled = false;
                }
            } catch (e) {
                btn.disabled = false;
            }
        }

        async function carregarProdutos() {
            const res = await fetchAdmin('/api/admin/produtos');
            produtosCache = await res.json();
            renderizarEstoqueMobile();
        }

        function renderizarEstoqueMobile() {
            const container = document.getElementById('lista-estoque-mobile');
            const termo = document.getElementById('busca-mobile').value.toLowerCase().trim();

            const filtrados = produtosCache.filter(p => {
                const bateBusca = p.nome.toLowerCase().includes(termo) ||
                    (p.etiqueta && p.etiqueta.toLowerCase().includes(termo)) ||
                    (p.categoria && p.categoria.toLowerCase().includes(termo));
                const bateFiltro = filtroEstoqueAtual === 'todos' || Number(p.estoque) < 3;
                return bateBusca && bateFiltro;
            });

            if (filtrados.length === 0) {
                container.innerHTML = `<div class="empty-state">Nenhuma peça encontrada com esse filtro.</div>`;
                return;
            }

            if (modoEstoqueAtual === 'lista') {
                let html = '';
                filtrados.forEach(p => {
                    const pid = Number(p.id);
                    const est = Number(p.estoque);
                    const precoAtual = p.em_promocao && p.preco_promocao ? Number(p.preco_promocao) : Number(p.preco);

                    html += `
                        <div class="stock-row ${p.ativo ? '' : 'hidden-item'}">
                            <img src="${safeURL(p.imagem_url)}" class="stock-img" alt="${escapeHTML(p.nome)}">
                            <div class="stock-info">
                                <h3 class="stock-name">${escapeHTML(p.nome)}</h3>
                                <div class="stock-meta">Tam ${escapeHTML(p.tamanho)} • ${escapeHTML(p.categoria)}</div>
                                <div class="stock-price">R$ ${precoAtual.toFixed(2).replace('.', ',')}</div>
                            </div>
                            <div class="stock-right">
                                <div class="stepper">
                                    <button class="step-btn" onclick="ajustarEstoque(${pid}, -1, this)">−</button>
                                    <span class="step-val ${est < 3 ? 'low' : ''}" id="est-val-${pid}">${est}</span>
                                    <button class="step-btn" onclick="ajustarEstoque(${pid}, 1, this)">+</button>
                                </div>
                                <div class="row-mini-icons">
                                    <button class="ico-mini" onclick="alternarVisibilidade(${pid})" title="Ocultar/Exibir">
                                        <i data-lucide="${p.ativo ? 'eye' : 'eye-off'}" style="width:13px;"></i>
                                    </button>
                                    <button class="ico-mini" onclick="editarProdutoMobile(${pid})" title="Editar">
                                        <i data-lucide="edit" style="width:13px;"></i>
                                    </button>
                                    <button class="ico-mini" style="color:var(--danger);" onclick="excluirProdutoMobile(${pid})" title="Excluir">
                                        <i data-lucide="trash-2" style="width:13px;"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } else {
                let html = '<div class="stock-grid-2">';
                filtrados.forEach(p => {
                    const pid = Number(p.id);
                    const est = Number(p.estoque);
                    const precoAtual = p.em_promocao && p.preco_promocao ? Number(p.preco_promocao) : Number(p.preco);

                    html += `
                        <div class="stock-grid-card ${p.ativo ? '' : 'hidden-item'}">
                            <img src="${safeURL(p.imagem_url)}" class="stock-grid-img" alt="${escapeHTML(p.nome)}">
                            <div class="stock-grid-body">
                                <h4 class="stock-grid-title">${escapeHTML(p.nome)}</h4>
                                <div class="stock-grid-sub">Tam ${escapeHTML(p.tamanho)} • ${escapeHTML(p.categoria)}</div>
                                <div class="stock-grid-foot">
                                    <strong style="font-size:13px;">R$ ${precoAtual.toFixed(2).replace('.', ',')}</strong>
                                    <div class="stepper">
                                        <button class="step-btn" style="width:24px;height:24px;font-size:14px;" onclick="ajustarEstoque(${pid}, -1, this)">−</button>
                                        <span class="step-val ${est < 3 ? 'low' : ''}" style="min-width:22px;font-size:12px;" id="est-val-${pid}">${est}</span>
                                        <button class="step-btn" style="width:24px;height:24px;font-size:14px;" onclick="ajustarEstoque(${pid}, 1, this)">+</button>
                                    </div>
                                </div>
                                <div class="stock-grid-tools">
                                    <button onclick="alternarVisibilidade(${pid})"><i data-lucide="${p.ativo ? 'eye' : 'eye-off'}" style="width:13px;"></i></button>
                                    <button onclick="editarProdutoMobile(${pid})"><i data-lucide="edit" style="width:13px;"></i></button>
                                    <button style="color:var(--danger);" onclick="excluirProdutoMobile(${pid})"><i data-lucide="trash-2" style="width:13px;"></i></button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
            }
            lucide.createIcons();
        }

        async function ajustarEstoque(id, delta, btn) {
            btn.disabled = true;
            try {
                const fd = new FormData();
                fd.append('delta', delta);
                const res = await fetchAdmin(`/api/admin/produtos/${Number(id)}/estoque`, {
                    method: 'PATCH',
                    body: fd
                });
                if (res.ok) {
                    const data = await res.json();
                    const item = produtosCache.find(x => x.id === id);
                    if (item) item.estoque = data.estoque;
                    const span = document.getElementById(`est-val-${id}`);
                    if (span) {
                        span.textContent = data.estoque;
                        span.classList.toggle('low', data.estoque < 3);
                    }
                }
            } finally {
                btn.disabled = false;
            }
        }

        async function alternarVisibilidade(id) {
            const res = await fetchAdmin(`/api/produtos/${Number(id)}/status`, { method: 'PATCH' });
            if (res.ok) {
                const item = produtosCache.find(x => x.id === id);
                if (item) item.ativo = !item.ativo;
                renderizarEstoqueMobile();
            }
        }

        async function excluirProdutoMobile(id) {
            if (!confirm("Excluir esta peça permanentemente?")) return;
            const res = await fetchAdmin(`/api/produtos/${Number(id)}`, { method: 'DELETE' });
            if (res.ok) {
                await carregarProdutos();
            }
        }

        function abrirAbaNovoProduto() {
            resetarFormProduto();
            trocarAba('produto');
        }

        function resetarFormProduto() {
            editandoId = null;
            fotoUrl1 = ""; fotoUrl2 = ""; fotoUrl3 = "";
            document.getElementById('form-prod-titulo').textContent = "Cadastrar Nova Peça";
            document.getElementById('btn-cancelar-edicao').style.display = "none";
            document.getElementById('btn-salvar-mob').innerHTML = `<i data-lucide="check-circle" style="width: 16px;"></i> Publicar no Catálogo`;
            document.getElementById('mob-nome').value = "";
            document.getElementById('mob-preco').value = "";
            document.getElementById('mob-estoque').value = "5";
            document.getElementById('mob-tamanho').value = "";
            document.getElementById('mob-etiqueta').value = "";
            document.getElementById('mob-descricao').value = "";
            document.getElementById('input-foto-mob').value = "";
            document.getElementById('preview-foto-mob').style.display = "none";
            document.getElementById('icone-cam-mob').style.display = "inline-block";
            document.getElementById('texto-foto-mob').textContent = "Tirar Foto ou Abrir Galeria";
            lucide.createIcons();
        }

        function editarProdutoMobile(id) {
            const p = produtosCache.find(x => x.id === id);
            if (!p) return;

            editandoId = id;
            fotoUrl1 = p.imagem_url || "";
            fotoUrl2 = p.imagem_url_2 || "";
            fotoUrl3 = p.imagem_url_3 || "";

            document.getElementById('form-prod-titulo').textContent = `Editar Peça #${Number(id)}`;
            document.getElementById('btn-cancelar-edicao').style.display = "inline-block";
            document.getElementById('btn-salvar-mob').innerHTML = `<i data-lucide="save" style="width: 16px;"></i> Salvar Alterações`;
            document.getElementById('mob-nome').value = p.nome || "";
            document.getElementById('mob-categoria').value = p.categoria || "";
            document.getElementById('mob-preco').value = p.preco || "";
            document.getElementById('mob-estoque').value = p.estoque ?? 1;
            document.getElementById('mob-tamanho').value = p.tamanho || "";
            document.getElementById('mob-etiqueta').value = p.etiqueta || p.cor || "";
            document.getElementById('mob-descricao').value = p.descricao || "";
            document.getElementById('input-foto-mob').value = "";

            if (fotoUrl1) {
                const prev = document.getElementById('preview-foto-mob');
                prev.src = safeURL(fotoUrl1);
                prev.style.display = "block";
                document.getElementById('icone-cam-mob').style.display = "none";
                document.getElementById('texto-foto-mob').textContent = "Toque para trocar a foto";
            }

            trocarAba('produto');
            lucide.createIcons();
        }

        function aoSelecionarFotos(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;
            const qtd = Math.min(files.length, 3);
            document.getElementById('texto-foto-mob').textContent = `${qtd} foto(s) pronta(s) para envio`;
            const reader = new FileReader();
            reader.onload = e => {
                const prev = document.getElementById('preview-foto-mob');
                prev.src = e.target.result;
                prev.style.display = "block";
                document.getElementById('icone-cam-mob').style.display = "none";
            };
            reader.readAsDataURL(files[0]);
        }

        async function uploadFotoMobile(file) {
            const fd = new FormData();
            fd.append("file", file);
            const res = await fetchAdmin("/api/upload", { method: "POST", body: fd });
            const data = await res.json();
            if (!res.ok || !data.url) {
                throw new Error(data.detail || "Falha ao enviar imagem.");
            }
            return data.url;
        }

        async function salvarProdutoMobile() {
            const nome = document.getElementById('mob-nome').value.trim();
            const categoria = document.getElementById('mob-categoria').value;
            const preco = parseFloat(document.getElementById('mob-preco').value || 0);
            const estoque = parseInt(document.getElementById('mob-estoque').value || 0);
            const tamanho = document.getElementById('mob-tamanho').value.trim();
            const etiqueta = document.getElementById('mob-etiqueta').value.trim();
            const descricao = document.getElementById('mob-descricao').value.trim();

            if (!nome || !categoria || preco <= 0 || !tamanho) {
                return alert("Preencha Nome, Categoria, Preço e Tamanho.");
            }

            const btn = document.getElementById('btn-salvar-mob');
            const htmlOriginal = btn.innerHTML;
            btn.disabled = true;
            btn.textContent = "Enviando...";

            try {
                const inputFotos = document.getElementById('input-foto-mob');
                if (inputFotos.files && inputFotos.files.length > 0) {
                    const limite = Math.min(inputFotos.files.length, 3);
                    for (let i = 0; i < limite; i++) {
                        const urlSubida = await uploadFotoMobile(inputFotos.files[i]);
                        if (i === 0) fotoUrl1 = urlSubida;
                        if (i === 1) fotoUrl2 = urlSubida;
                        if (i === 2) fotoUrl3 = urlSubida;
                    }
                }

                if (!fotoUrl1) {
                    throw new Error("Selecione pelo menos 1 foto do produto.");
                }

                const payload = {
                    nome,
                    preco,
                    estoque,
                    imagem_url: fotoUrl1,
                    imagem_url_2: fotoUrl2 || null,
                    imagem_url_3: fotoUrl3 || null,
                    descricao,
                    tamanho,
                    cor: etiqueta,
                    categoria,
                    etiqueta
                };

                const url = editandoId ? `/api/produtos/${Number(editandoId)}` : '/api/produtos';
                const method = editandoId ? 'PUT' : 'POST';

                const res = await fetchAdmin(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || "Erro ao salvar produto.");
                }

                alert(editandoId ? "Peça atualizada com sucesso!" : "Peça publicada na vitrine!");
                resetarFormProduto();
                await carregarProdutos();
                trocarAba('estoque');
            } catch (err) {
                alert(err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = htmlOriginal;
                lucide.createIcons();
            }
        }

        async function carregarCategorias() {
            const res = await fetchAdmin('/api/categorias');
            categoriasCache = await res.json();

            const select = document.getElementById('mob-categoria');
            const lista = document.getElementById('lista-categorias-mobile');

            if (categoriasCache.length === 0) {
                select.innerHTML = '<option value="">Crie uma categoria primeiro</option>';
                lista.innerHTML = '<div style="padding:16px; text-align:center; color:var(--muted); font-size:13px;">Nenhuma categoria cadastrada.</div>';
                return;
            }

            select.innerHTML = '';
            lista.innerHTML = '';

            categoriasCache.forEach(c => {
                const cid = Number(c.id);
                const cSafe = escapeHTML(c.nome);
                select.innerHTML += `<option value="${cSafe}">${cSafe}</option>`;
                lista.innerHTML += `
                    <div class="cat-row">
                        <span class="cat-name">${cSafe}</span>
                        <button class="ico-mini" style="color:var(--danger);" onclick="excluirCategoriaMobile(${cid})">
                            <i data-lucide="trash-2" style="width: 14px;"></i>
                        </button>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        async function criarCategoriaMobile() {
            const input = document.getElementById('mob-nova-cat');
            const nome = input.value.trim();
            if (!nome) return;

            const res = await fetchAdmin('/api/categorias', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome })
            });

            if (res.ok) {
                input.value = '';
                await carregarCategorias();
            } else {
                const err = await res.json();
                alert(err.detail || "Não foi possível criar a categoria.");
            }
        }

        async function excluirCategoriaMobile(id) {
            if (!confirm("Excluir esta categoria?")) return;
            const res = await fetchAdmin(`/api/categorias/${Number(id)}`, { method: 'DELETE' });
            if (res.ok) {
                await carregarCategorias();
            }
        }

        async function atualizarTudo() {
            const icon = document.querySelector('#btn-refresh i');
            if (icon) icon.classList.add('spin');
            try {
                await Promise.all([
                    carregarIndicadores(),
                    carregarPedidos(),
                    carregarProdutos(),
                    carregarCategorias()
                ]);
            } finally {
                if (icon) setTimeout(() => icon.classList.remove('spin'), 300);
            }
        }

        atualizarTudo();
        setInterval(carregarIndicadores, 30000);
    </script>
</body>
</html>
