<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Acesso Restrito - Plataforma</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #06080a; display: flex; justify-content: center; align-items: center; height: 100vh; color: #fff; }
        .login-box { background: #111827; padding: 40px; border-radius: 12px; width: 100%; max-width: 360px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); border: 1px solid #1f2937; text-align: center; }
        .login-box h2 { margin: 0 0 10px 0; font-weight: 500; letter-spacing: 1px; }
        .login-box p { color: #9ca3af; font-size: 14px; margin-bottom: 30px; }
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #9ca3af; margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 12px; background: #1f2937; border: 1px solid #374151; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 15px; transition: 0.3s; }
        .input-group input:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        .btn-login { background: #3b82f6; color: #fff; border: none; padding: 14px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 15px; margin-top: 10px; }
        .btn-login:hover { background: #2563eb; }
        .error-msg { color: #ef4444; font-size: 13px; margin-bottom: 20px; display: none; background: rgba(239, 68, 68, 0.1); padding: 10px; border-radius: 4px; border: 1px solid rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Painel de Gestão</h2>
        <p>Insira suas credenciais para acessar.</p>
        
        <div class="error-msg" id="erroMsg">Usuário ou senha incorretos.</div>
        
        <form action="/api/login" method="POST">
            <div class="input-group">
                <label>Usuário</label>
                <input type="text" name="usuario" required placeholder="ex: admin">
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" name="senha" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login">Entrar no Sistema</button>
        </form>
    </div>
    <script>
        if (window.location.search.includes("erro=1")) {
            document.getElementById('erroMsg').style.display = 'block';
        }
    </script>
</body>
</html>
