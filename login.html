<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marli Essencial | Acesso Restrito</title>
    <!-- Favicon SVG Dinâmico -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231e1b20'/><text x='50%' y='50%' font-family='Inter, sans-serif' font-size='60' font-weight='800' fill='%23b48484' dominant-baseline='central' text-anchor='middle'>M</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        :root {
            --sidebar: #1e1b20;
            --primary: #b48484;
            --bg: #fdfbfb;
            --text: #ffffff;
            --border: rgba(255, 255, 255, 0.12);
        }
        
        body { 
            margin: 0; padding: 0; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; color: var(--text);
            /* Fundo SaaS Mesh Gradient Nude & Chumbo */
            background-color: #161318;
            background-image: radial-gradient(at 10% 10%, hsla(340, 24%, 30%, 0.4) 0px, transparent 50%),
                              radial-gradient(at 90% 90%, hsla(340, 24%, 20%, 0.5) 0px, transparent 50%),
                              radial-gradient(at 50% 50%, hsla(270, 15%, 10%, 1) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .login-card { 
            background: rgba(30, 27, 32, 0.75); 
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 44px 40px; 
            border-radius: 20px; 
            width: 100%; 
            max-width: 400px; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1); 
            border: 1px solid var(--border); 
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-header { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 24px; }
        .brand-logo { width: 44px; height: 44px; background: rgba(180, 132, 132, 0.15); border: 1px solid rgba(180, 132, 132, 0.3); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--primary); }
        
        .login-card h2 { margin: 0 0 6px 0; font-size: 22px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
        .login-card p { color: #94a3b8; font-size: 13px; margin: 0 0 32px 0; font-weight: 500; }

        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: #a199a6; font-weight: 700; margin-bottom: 8px; }
        
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #716975; width: 18px; height: 18px; }
        .input-wrapper input { width: 100%; height: 48px; padding: 0 16px 0 44px; background: rgba(15, 13, 17, 0.6); border: 1px solid var(--border); color: #fff; border-radius: 10px; font-size: 14px; transition: all 0.2s ease; }
        .input-wrapper input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px rgba(180, 132, 132, 0.18); background: rgba(15, 13, 17, 0.9); }
        
        .btn-login { background: var(--primary); color: #fff; border: none; height: 48px; width: 100%; border-radius: 10px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; font-size: 14px; margin-top: 10px; box-shadow: 0 4px 16px rgba(180, 132, 132, 0.3); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-login:hover { background: #9c6c6c; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(180, 132, 132, 0.4); }

        .error-msg { color: #fca5a5; font-size: 13px; margin-bottom: 24px; display: none; background: rgba(239, 68, 68, 0.15); padding: 12px; border-radius: 8px; border: 1px solid rgba(239, 68, 68, 0.3); font-weight: 500; }
        .footer-note { margin-top: 28px; font-size: 11px; color: #64748b; font-weight: 500; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-header">
            <div class="brand-logo"><i data-lucide="sparkles"></i></div>
        </div>
        <h2>Marli Essencial</h2>
        <p>Acesse o painel executivo de gestão</p>
        
        <div class="error-msg" id="erroMsg">Usuário ou senha incorretos.</div>
        
        <form action="/api/login" method="POST">
            <div class="input-group">
                <label>Usuário</label>
                <div class="input-wrapper">
                    <i data-lucide="user"></i>
                    <input type="text" name="usuario" required placeholder="Digite seu usuário">
                </div>
            </div>
            <div class="input-group">
                <label>Senha</label>
                <div class="input-wrapper">
                    <i data-lucide="lock"></i>
                    <input type="password" name="senha" required placeholder="••••••••">
                </div>
            </div>
            <button type="submit" class="btn-login"><i data-lucide="log-in" style="width: 18px;"></i> Entrar no Sistema</button>
        </form>

        <div class="footer-note">SaaS Gestão Multi-Tenant v2.4</div>
    </div>

    <script>
        lucide.createIcons();
        if (window.location.search.includes("erro=1")) {
            document.getElementById('erroMsg').style.display = 'block';
        }
    </script>
</body>
</html>
