<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Marli Lingerie | Moda Íntima</title>
    <meta name="description" content="Descubra a Sua Essência. Peças pensadas para o conforto e a elegância do seu dia a dia. Explore a nossa nova curadoria de moda íntima.">
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="Marli Lingerie | Moda Íntima e Conforto">
    <meta property="og:description" content="Explore a nossa nova coleção exclusiva. Peças elegantes, confortáveis e com os melhores preços. Compre direto pelo WhatsApp!">
    
    <meta property="og:image" content="https://images.unsplash.com/photo-1582230113172-2d1f9ec1c7bd?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://marli-lingerie.onrender.com">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --bg: #ffffff; --text: #171717; --muted: #737373; --border: #e5e5e5; --brand: #000000; --promo: #ef4444; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; -webkit-font-smoothing: antialiased; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); z-index: 40; }
        .logo { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 600; letter-spacing: 2px; }
        .menu-top button { background: none; border: none; font-size: 14px; font-weight: 500; margin-left: 20px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); transition: 0.2s; }
        .menu-top button:hover, .menu-top button.active { color: var(--brand); border-bottom: 2px solid var(--brand); }

        .hero { background: #f5f5f5; padding: 80px 20px; text-align: center; }
        .hero h1 { font-family: 'Playfair Display', serif; font-size: 48px; margin: 0 0 16px 0; }
        .hero p { color: var(--muted); font-size: 18px; max-width: 600px; margin: 0 auto; }

        .container { max-width: 1200px; margin: 60px auto; padding: 0 24px; }
        .section-title { font-family: 'Playfair Display', serif; font-size: 32px; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 40px; display: flex; align-items: center; gap: 12px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 40px; }
        .card { cursor: pointer; }
        .img-wrap { overflow: hidden; position: relative; aspect-ratio: 3/4; background: #fafafa; border-radius: 8px; margin-bottom: 16px; }
        .img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
        .card:hover .img-wrap img { transform: scale(1.05); }
        
        .badge-promo { position: absolute; top: 12px; left: 12px; background: var(--promo); color: white; padding: 4px 12px; font-size: 11px; font-weight: 600; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; z-index: 10; }
        
        .card-info h3 { margin: 0 0 8px 0; font-size: 16px; font-weight: 500; }
        .card-meta { font-size: 12px; color: var(--muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        
        .price-box { display: flex; justify-content: space-between; align-items: center; }
        .price-normal { font-size: 18px; font-weight: 600; }
        .price-old { font-size: 14px; color: var(--muted); text-decoration: line-through; margin-right: 8px; }
        .price-new { font-size: 18px; font-weight: 600; color: var(--promo); }
        
        .btn-add { background: var(--brand); color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .btn-add:hover { transform: scale(1.1); }

        .fab-wa { position: fixed; bottom: 32px; left: 32px; background: #25D366; color: white; width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4); z-index: 50; animation: pulse 2s infinite; text-decoration: none; transition: transform 0.3s;}
        .fab-wa:hover { transform: scale(1.1); }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); } 100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); } }
        
        .cart-trigger { position: fixed; bottom: 32px; right: 32px; background: var(--brand); color: #fff; padding: 16px 32px; border-radius: 30px; cursor: pointer; font-size: 14px; font-weight: 500; z-index: 50; border: none; box-shadow: 0 8px 24px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 10px; transition: 0.2s;}
        .cart-trigger:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0,0,0,0.25); }

        .sidebar-cart { position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100vh; background: var(--bg); border-left: 1px solid var(--border); transition: 0.4s; z-index: 100; display: flex; flex-direction: column; }
        .sidebar-cart.open { right: 0; }
        .cart-header { padding: 32px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .cart-body { padding: 32px; flex-grow: 1; overflow-y: auto; }
        .cart-item { margin-bottom: 24px; font-size: 14px; display: flex; justify-content: space-between; }
        .cart-footer { padding: 32px; border-top: 1px solid var(--border); background: #fafafa; }
        .cart-total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 600; margin-bottom: 24px; }
        .input-dark { width: 100%; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; font-family: 'Inter'; }
        .btn-checkout { background: var(--brand); color: #fff; padding: 16px; width: 100%; border: none; font-weight: 500; border-radius: 8px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.2s; }
        .btn-checkout:hover { background: #333; }
    </style>
</head>
<body>

    <header>
        <div class="logo" id="logo-loja">LOJA</div>
        <div class="menu-top" id="menus">
            <button class="active" onclick="mudarSessao('tudo')">A Coleção</button>
            <button onclick="mudarSessao('novidades')">Lançamentos</button>
            <button onclick="mudarSessao('promocoes')" style="color: var(--promo);">Ofertas Exclusivas</button>
        </div>
    </header>

    <div class="hero">
        <h1>Descubra a Sua Essência</h1>
        <p>Peças pensadas para o conforto e a elegância do seu dia a dia. Explore a nossa nova curadoria de moda íntima.</p>
    </div>

    <div class="container">
        <h2 class="section-title" id="titulo-secao"><i data-lucide="sparkles"></i> Catálogo Completo</h2>
        <div class="grid" id="catalogo"></div>
    </div>

    <a href="#" id="btn-wa-flutuante" class="fab-wa" target="_blank"><i data-lucide="message-circle"></i></a>
    
    <button class="cart-trigger" onclick="toggleCart()"><i data-lucide="shopping-bag" style="width: 18px;"></i> Sacola (<span id="cart-count">0</span>)</button>

    <div class="sidebar-cart" id="sidebar">
        <div class="cart-header"><h2>A Sua Sacola</h2><button onclick="toggleCart()" style="background:none;border:none;cursor:pointer;"><i data-lucide="x"></i></button></div>
        <div class="cart-body" id="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-total"><span>Total</span> <span>R$ <span id="cart-total">0.00</span></span></div>
            <input type="text" id="nomeCliente" class="input-dark" placeholder="Como devemos chamá-la?">
            <button class="btn-checkout" onclick="enviarWhatsApp()"><i data-lucide="send" style="width: 18px;"></i> Enviar Pedido</button>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let carrinho = []; let todosProdutos = []; let numeroLoja = "";

        async function carregarConfiguracoes() {
            try {
                const res = await fetch('/api/config');
                const config = await res.json();
                numeroLoja = config.whatsapp;
                
                document.getElementById('logo-loja').innerText = config.nome_loja.toUpperCase();
                
                // Configura o Botão Flutuante
                const btnWa = document.getElementById('btn-wa-flutuante');
                if (btnWa && numeroLoja) {
                    btnWa.href = `https://wa.me/${numeroLoja}?text=Olá!%20Estou%20no%20site%20e%20gostaria%20de%20ajuda.`;
                }
            } catch(e) { console.error("Erro na config", e); }
        }

        async function carregarProdutos() {
            const res = await fetch('/api/produtos');
            todosProdutos = await res.json();
            mudarSessao('tudo');
        }

        function mudarSessao(tipo) {
            document.querySelectorAll('.menu-top button').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            let filtro = [];
            if(tipo === 'tudo') { filtro = todosProdutos; document.getElementById('titulo-secao').innerHTML = '<i data-lucide="layers"></i> Catálogo Completo'; }
            if(tipo === 'novidades') { filtro = todosProdutos.slice(0, 8); document.getElementById('titulo-secao').innerHTML = '<i data-lucide="sparkles"></i> Últimos Lançamentos'; }
            if(tipo === 'promocoes') { filtro = todosProdutos.filter(p => p.em_promocao); document.getElementById('titulo-secao').innerHTML = '<i data-lucide="tag" style="color:red;"></i> Ofertas Exclusivas'; }
            
            renderizar(filtro);
            lucide.createIcons();
        }

        function renderizar(produtos) {
            const catalogo = document.getElementById('catalogo');
            if(produtos.length === 0) { catalogo.innerHTML = "<p style='color:#737373;'>Nenhuma peça encontrada.</p>"; return; }
            
            catalogo.innerHTML = '';
            produtos.forEach(p => {
                const badge = p.em_promocao ? `<div class="badge-promo">PROMOÇÃO</div>` : '';
                const priceHTML = p.em_promocao 
                    ? `<span class="price-old">R$ ${p.preco.toFixed(2)}</span><span class="price-new">R$ ${p.preco_promocao.toFixed(2)}</span>` 
                    : `<span class="price-normal">R$ ${p.preco.toFixed(2)}</span>`;
                const precoReal = p.em_promocao ? p.preco_promocao : p.preco;

                catalogo.innerHTML += `
                    <div class="card">
                        <div class="img-wrap">${badge}<img src="${p.imagem_url}"></div>
                        <div class="card-info">
                            <div class="card-meta">Tam ${p.tamanho} • ${p.categoria}</div>
                            <h3>${p.nome}</h3>
                            <div class="price-box">
                                <div>${priceHTML}</div>
                                <button class="btn-add" onclick="addCart(${p.id}, '${p.nome}', ${precoReal}, '${p.tamanho}')"><i data-lucide="plus" style="width:18px;"></i></button>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function addCart(id, nome, preco, tam) {
            const item = carrinho.find(i => i.produto_id === id);
            if (item) item.quantidade++; else carrinho.push({ produto_id: id, nome, preco, tamanho: tam, quantidade: 1 });
            atualizarCart(); toggleCart(true);
        }

        function atualizarCart() {
            document.getElementById('cart-count').innerText = carrinho.reduce((sum, i) => sum + i.quantidade, 0);
            const div = document.getElementById('cart-items'); div.innerHTML = ''; let total = 0;
            carrinho.forEach(i => {
                total += i.preco * i.quantidade;
                div.innerHTML += `<div class="cart-item"><div><b>${i.quantidade}x ${i.nome}</b><br><span style="font-size:12px;color:#737373;">Tam: ${i.tamanho}</span></div><b>R$ ${(i.preco * i.quantidade).toFixed(2)}</b></div>`;
            });
            document.getElementById('cart-total').innerText = total.toFixed(2);
        }

        function toggleCart(force = false) {
            const s = document.getElementById('sidebar');
            force ? s.classList.add('open') : s.classList.toggle('open');
        }

        async function enviarWhatsApp() {
            const nome = document.getElementById('nomeCliente').value;
            if(!nome || carrinho.length===0) return alert("Preencha o nome e adicione peças.");
            const res = await fetch('/api/comprar', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({cliente_nome:nome, telefone:"", itens:carrinho}) });
            const dados = await res.json();
            if(dados.status === "sucesso") window.location.href = dados.whatsapp_url;
        }
        
        carregarConfiguracoes();
        carregarProdutos();
    </script>
</body>
</html>
